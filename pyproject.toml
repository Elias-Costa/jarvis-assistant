[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Assistente pessoal em Python com comandos por texto e voz no Windows."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "openai>=2.32.0",
  "pydantic>=2.0",
  "python-dotenv>=0.21",
  "sounddevice>=0.5.5"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
